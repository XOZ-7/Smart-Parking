<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VISIONPARK - 3D Digital Twin</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #050811; font-family: 'Segoe UI', sans-serif; }
        
        #hud {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #fff;
            background: rgba(15, 23, 42, 0.9);
            padding: 18px 24px;
            border-radius: 12px;
            border: 1px solid #334155;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            pointer-events: none;
            z-index: 100;
        }

        h1 { margin: 0 0 5px 0; font-size: 1.3rem; color: #3b82f6; letter-spacing: 1px; }
        .stat-row { display: flex; gap: 20px; margin-top: 12px; font-size: 0.95rem; }
        .badge { display: inline-block; background: rgba(34, 197, 94, 0.2); color: #22c55e; padding: 4px 10px; border-radius: 20px; font-weight: bold; font-size: 0.75rem; }
        .badge.off { background: rgba(239, 68, 68, 0.2); color: #ef4444; }
    </style>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

    <div id="hud">
        <h1>VISIONPARK 3D DIGITAL TWIN</h1>
        <div id="sync-status" class="badge off">INITIALIZING...</div>
        <div class="stat-row">
            <div>Total: <strong id="total-val">396</strong></div>
            <div>Occupied: <strong id="occ-val" style="color:#ef4444;">--</strong></div>
            <div>Free: <strong id="free-val" style="color:#22c55e;">--</strong></div>
        </div>
    </div>

    <script>
        // --- 1. THREE.JS SCENE SETUP ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x070a12);
        scene.fog = new THREE.FogExp2(0x070a12, 0.005);

        const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 55, 75);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.target.set(0, 0, 0);

        // Lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(40, 80, 40);
        dirLight.castShadow = true;
        scene.add(dirLight);

        // Ground Plane
        const groundGeo = new THREE.PlaneGeometry(160, 100);
        const groundMat = new THREE.MeshStandardMaterial({ color: 0x111827, roughness: 0.9 });
        const ground = new THREE.Mesh(groundGeo, groundMat);
        ground.rotation.x = -Math.PI / 2;
        scene.add(ground);

        // --- 2. 3D MESH GENERATION ---
        const slotMeshes = {};
        const carMeshes = {};

        const vacantMat = new THREE.MeshStandardMaterial({ color: 0x22c55e, transparent: true, opacity: 0.5 });
        const occupiedMat = new THREE.MeshStandardMaterial({ color: 0xef4444, transparent: true, opacity: 0.8 });
        
        const carMat = new THREE.MeshStandardMaterial({ color: 0x38bdf8, metalness: 0.6, roughness: 0.3 });
        const roofMat = new THREE.MeshStandardMaterial({ color: 0x0f172a, metalness: 0.8 });

        function createCarModel() {
            const carGroup = new THREE.Group();
            
            // Chassis
            const bodyGeo = new THREE.BoxGeometry(2.2, 0.8, 4.0);
            const body = new THREE.Mesh(bodyGeo, carMat);
            body.position.y = 0.5;
            carGroup.add(body);

            // Roof
            const cabinGeo = new THREE.BoxGeometry(1.8, 0.6, 2.2);
            const cabin = new THREE.Mesh(cabinGeo, roofMat);
            cabin.position.set(0, 1.1, -0.2);
            carGroup.add(cabin);

            return carGroup;
        }

        function build3DLot(slotList) {
            const slotsPerColumn = 33;

            slotList.forEach((slot, idx) => {
                const col = Math.floor(idx / slotsPerColumn);
                const row = idx % slotsPerColumn;

                const aisleOffset = Math.floor(col / 2) * 6.0;
                const posX = (col * 3.5) - 22 + aisleOffset;
                const posZ = (row * 2.4) - 38;

                // Slot Pad
                const padGeo = new THREE.BoxGeometry(3.0, 0.08, 2.1);
                const padMesh = new THREE.Mesh(padGeo, vacantMat.clone());
                padMesh.position.set(posX, 0.04, posZ);
                scene.add(padMesh);
                slotMeshes[slot.slot_id] = padMesh;

                // Car Model
                const car = createCarModel();
                car.position.set(posX, 0.0, posZ);
                car.visible = false;
                scene.add(car);
                carMeshes[slot.slot_id] = car;
            });
        }

        // --- 3. STATE SYNC (HTTP + WebSocket Fallback) ---
        function updateSceneState(slots) {
            let occupiedCount = 0;
            slots.forEach(slot => {
                const pad = slotMeshes[slot.slot_id];
                const car = carMeshes[slot.slot_id];

                if (pad && car) {
                    const isOccupied = slot.status === "occupied";
                    pad.material.color.setHex(isOccupied ? 0xef4444 : 0x22c55e);
                    car.visible = isOccupied;
                    if (isOccupied) occupiedCount++;
                }
            });

            document.getElementById('occ-val').innerText = occupiedCount;
            document.getElementById('free-val').innerText = slots.length - occupiedCount;
        }

        // Load Slots & Start Polling
        fetch('http://127.0.0.1:8000/api/v1/slots/live')
            .then(res => res.json())
            .then(data => {
                build3DLot(data.slots);
                updateSceneState(data.slots);
                
                const badge = document.getElementById('sync-status');
                badge.innerText = "HTTP SYNC ACTIVE";
                badge.className = "badge";

                // Poll every 2 seconds
                setInterval(() => {
                    fetch('http://127.0.0.1:8000/api/v1/slots/live')
                        .then(r => r.json())
                        .then(d => updateSceneState(d.slots));
                }, 2000);
            })
            .catch(err => {
                console.error("API Error:", err);
                const badge = document.getElementById('sync-status');
                badge.innerText = "API OFFLINE";
                badge.className = "badge off";
            });

        // --- 4. RENDER LOOP ---
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
